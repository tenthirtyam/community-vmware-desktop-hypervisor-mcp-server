---
# Copyright (c) Ryan Johnson
# SPDX-License-Identifier: MIT

# ----------------------------------------------------------------------------------- #
# Project Information
# ----------------------------------------------------------------------------------- #
site_name: community-vmware-desktop-hypervisor-mcp-server
site_description: A Community MCP server for VMware Desktop Hypervisors
site_url: https://tenthirtyam.org/community-vmware-desktop-hypervisor-mcp-server/
site_author: Ryan Johnson
site_dir: .site

# ----------------------------------------------------------------------------------- #
# Repository
# ----------------------------------------------------------------------------------- #
repo_url: https://github.com/tenthirtyam/community-vmware-desktop-hypervisor-mcp-server
repo_name: GitHub

# ----------------------------------------------------------------------------------- #
# Copyright
# ----------------------------------------------------------------------------------- #
copyright: Copyright (c) Ryan Johnson. Licensed under the MIT License.

# ----------------------------------------------------------------------------------- #
# Configuration
# ----------------------------------------------------------------------------------- #
theme:
  name: materialx
  language: en
  favicon: favicon.ico
  icon:
    logo: octicons/mcp-16
    repo: fontawesome/brands/github
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to Light Mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to Dark Mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Use Your System Preferences
  font:
    text: Inter
    code: Fira Code
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - navigation.expand
  - navigation.footer
  - navigation.indexes
  - navigation.indent
  - navigation.instant
  - navigation.path
  - navigation.prune
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow

# ----------------------------------------------------------------------------------- #
# Plugins
# ----------------------------------------------------------------------------------- #
plugins:
  - minify:
      minify_html: true
  - open-in-new-tab
  - search:
      separator: '[\s\u200b\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang: en
  - git-revision-date-localized:
      enable_creation_date: false
      exclude:
        - index.md
      fallback_to_build_date: true
      type: timeago
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters:
              - "!^_"

# ----------------------------------------------------------------------------------- #
# Customization
# ----------------------------------------------------------------------------------- #
extra:
  analytics:
    provider: google
    property: G-3L0BST2MGY
  consent:
    title: Cookie Consent
    description: >-
      This website uses Google Analytics, which uses cookies to track visitor interactions.
      This helps us understand the number of people using our site, how they navigate through
      our web pages, and how they found our website. These cookies do not collect personal
      information and are used for statistical analysis only. You can adjust your browser
      settings to reject cookies if you prefer.
    actions:
      - accept
      - manage
      - reject
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:&#114;&#121;&#97;&#110;&#64;&#116;&#101;&#110;&#116;&#104;&#105;&#114;&#116;&#121;&#97;&#109;&#46;&#111;&#114;&#103;?subject=Hypertext%20Dispatches
      name: Inbox Me
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/ryan.tenthirtyam.org
      name: Follow on Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/tenthirtyam
      name: Connect on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/tenthirtyam
      name: Follow on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/tenthirtyam
      name: Follow on Docker Hub
    - icon: simple/soundcloud
      link: https://soundcloud.com/39north
      name: Follow on SoundCloud

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

# ----------------------------------------------------------------------------------- #
# Extensions
# ----------------------------------------------------------------------------------- #
markdown_extensions:
- abbr
- admonition
- attr_list
- footnotes
- md_in_html
- pymdownx.betterem:
    smart_enable: all
- pymdownx.critic
- pymdownx.caret
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.snippets:
    check_paths: true
    base_path:
      - docs
      - .
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.mark
- pymdownx.tilde
- tables
- toc:
    permalink: true
    toc_depth: 3

# ----------------------------------------------------------------------------------- #
# Navigation
# ----------------------------------------------------------------------------------- #
nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Integration: getting-started/integration.md
      - Configuration: getting-started/configuration.md
      - Tools Reference: getting-started/tools-reference.md
      - Error Handling: getting-started/error-handling.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Community:
      - community/index.md
      - Contributing: community/contributing.md
      - Code of Conduct: community/code-of-conduct.md
      - Security: community/security.md
      - Development: community/development.md
      - Releases: https://github.com/tenthirtyam/community-vmware-desktop-hypervisor-mcp-server/releases
      - Discussions: https://github.com/tenthirtyam/community-vmware-desktop-hypervisor-mcp-server/discussions
      - License: community/license.md
      - Disclaimer: community/disclaimer.md
