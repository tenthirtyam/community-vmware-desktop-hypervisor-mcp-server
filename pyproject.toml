[project]
name = "community-vmware-desktop-hypervisor-mcp-server"
version = "0.1.0"
description = "A Community MCP Server for VMware Desktop Hypervisors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.12+: shutil.which(PathLike) on Windows always returned None before 3.12 (cpython#85493).
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "defusedxml>=0.7.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.1.0",
    "ruff>=0.15.20",
    "pre-commit>=4.6.0",
]
docs = [
    "mkdocs-materialx==10.1.8",
    "properdocs==1.6.7",
    "mkdocs-git-revision-date-localized-plugin==1.5.3",
    "mkdocs-minify-plugin==0.8.0",
    "mkdocs-open-in-new-tab==1.0.8",
    "mkdocstrings[python]==1.0.4",
]

[project.scripts]
community-vmware-desktop-hypervisor-mcp-server = "community_vmware_desktop_hypervisor_mcp_server.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: live VMware Fusion tests (requires VMCLI_E2E=1 and local hypervisor environment)",
]
addopts = [
    "-m",
    "not e2e",
    "--cov=community_vmware_desktop_hypervisor_mcp_server",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

[tool.coverage.run]
source = ["src/community_vmware_desktop_hypervisor_mcp_server"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "community_vmware_desktop_hypervisor_mcp_server.server"
disable_error_code = ["misc", "no-untyped-call"]

[[tool.mypy.overrides]]
module = "community_vmware_desktop_hypervisor_mcp_server.tools"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "community_vmware_desktop_hypervisor_mcp_server.server_common"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "community_vmware_desktop_hypervisor_mcp_server.vmcli"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "community_vmware_desktop_hypervisor_mcp_server.config"
disable_error_code = ["attr-defined"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]
ignore = [
    "S101",    # Use of assert detected (needed for tests)
    "PLR0913", # Too many arguments to function call
    "TRY003",  # Avoid specifying long messages outside exception class
    "G004",    # Logging f-strings (consistent with existing codebase)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ANN201",  # Missing return type annotation for public function
    "ANN001",  # Fixture/mocking annotations
    "ANN401",  # Any in mocks
    "SLF001",  # Private member access in tests
    "E501",    # Long mock setup lines
    "S106",    # Test passwords
    "PT011",   # Broad pytest.raises in negative tests
    "PT012",   # Multi-statement raises blocks
    "SIM117",  # Nested with in tests
    "ARG002",  # Unused mock method args
    "ARG005",  # Unused lambda args in mocks
]
"src/community_vmware_desktop_hypervisor_mcp_server/_generated_actions.py" = ["E501", "Q000"]
"src/community_vmware_desktop_hypervisor_mcp_server/discovery.py" = ["E501", "TCH003", "EM102", "SIM102", "PLR2004"]
"scripts/*.py" = [
    "T20",     # print() is intentional in CLI scripts
    "PLR2004", # Magic values acceptable in CLI arg count checks
]
"src/community_vmware_desktop_hypervisor_mcp_server/context.py" = ["PLW0603", "PLC0415"]
"src/community_vmware_desktop_hypervisor_mcp_server/schemas.py" = ["ANN102", "TCH001", "ANN101", "SIM102"]
"src/community_vmware_desktop_hypervisor_mcp_server/tools.py" = ["E501", "ERA001", "TCH001", "TCH002", "TCH003"]
"src/community_vmware_desktop_hypervisor_mcp_server/server.py" = ["TRY401", "TRY400", "TCH003"]
"src/community_vmware_desktop_hypervisor_mcp_server/server_common.py" = ["E501", "ANN101"]
"src/community_vmware_desktop_hypervisor_mcp_server/vmcli.py" = ["E501", "TCH003", "ANN101"]
"src/community_vmware_desktop_hypervisor_mcp_server/handlers.py" = ["PLR0911", "PLR0912", "PLR0915", "E501", "TCH002", "TCH003", "UP040"]
"src/community_vmware_desktop_hypervisor_mcp_server/config.py" = ["PLC0415", "EM101", "ANN102", "PLW0603"]
"src/community_vmware_desktop_hypervisor_mcp_server/platform_detector.py" = ["EM102"]
"src/community_vmware_desktop_hypervisor_mcp_server/inventory.py" = ["PLW2901", "PLW0602", "EM102", "PLW0603"]
"tests/conftest.py" = ["ARG001"]
"tests/test_inventory.py" = ["TCH003", "PLC0415"]
"tests/test_vmcli.py" = ["TCH003", "S108"]
"tests/test_handlers.py" = ["S108", "TC001", "TC002", "TC003", "PLC0415", "I001"]
"tests/test_discovery_async.py" = ["Q003"]
"tests/test_e2e.py" = ["PLC0415"]
"tests/test_server.py" = ["SLF001"]
"tests/test_schemas.py" = ["RUF043", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["community_vmware_desktop_hypervisor_mcp_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
