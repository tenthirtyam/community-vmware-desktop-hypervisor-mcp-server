---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(gh)
      include: scope
    labels:
      - chore
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - chore
      - dependencies
    groups:
      dev-dependencies:
        patterns:
          - pytest*
          - mypy
          - ruff
          - pre-commit
          - pytest-*
      runtime-dependencies:
        patterns:
          - mcp
          - pydantic
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /.github/workflows
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docs)
      include: scope
    labels:
      - chore
      - dependencies
    groups:
      docs-tooling:
        patterns:
          - "*"
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
